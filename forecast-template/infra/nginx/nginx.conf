# Reverse proxy: единственная точка входа (:80). Владелец: DevOps. Маршруты по CONVENTIONS.md.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time cid=$http_x_correlation_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Импорт CSV до ~3 млн строк через multipart.
  client_max_body_size 500m;
  client_body_timeout  300s;

  gzip on;
  gzip_types application/json text/csv text/css application/javascript image/svg+xml;

  upstream api      { server api:8080; }
  upstream frontend { server frontend:80; }

  server {
    listen 80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # X-Correlation-Id передаётся как есть (nginx не трогает заголовки клиента).

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Алиас готовности: фронт и smoke CI ходят сюда.
    location = /api/health {
      proxy_pass http://api/health/ready;
      proxy_connect_timeout 3s;
      proxy_read_timeout    5s;
    }

    location /api/ {
      proxy_pass http://api;          # URI без изменений: /api/... -> api:8080/api/...
      proxy_connect_timeout 5s;
      proxy_send_timeout    300s;
      proxy_read_timeout    300s;     # export.csv и медленные ответы
      proxy_request_buffering off;    # большие загрузки идут потоком
    }

    location / {
      proxy_pass http://frontend;
    }
  }
}
